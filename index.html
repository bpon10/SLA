<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Loss Assessment</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:14px;background:#f6f7fb;color:#1f2937}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    h1{font-size:24px;margin:0 0 6px} h2{font-size:19px;margin:22px 0 8px;border-bottom:2px solid #d1d5db;padding-bottom:5px}
    label{display:block;font-weight:700;margin:12px 0 6px}
    input[type=text],textarea{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid #cbd5e1;border-radius:12px}
    textarea{min-height:90px;resize:vertical}
    .q{padding:14px 0;border-top:1px solid #eef2f7}.q:first-child{border-top:none}
    .qtext{font-weight:600;margin-bottom:10px;line-height:1.35}
    .yn{display:flex;gap:10px;flex-wrap:wrap}.yn button{flex:1;min-width:120px;padding:13px 10px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:16px}
    .yn button.active.yes{background:#dcfce7;border-color:#22c55e}.yn button.active.no{background:#fee2e2;border-color:#ef4444}
    .submit{width:100%;margin-top:16px;padding:15px 18px;border:none;border-radius:14px;background:#2563eb;color:#fff;font-size:17px;font-weight:700}
    .small{color:#6b7280;font-size:13px;line-height:1.4}
    .meta{display:grid;grid-template-columns:1fr;gap:10px}
    .progress{font-weight:700}.status{margin-top:10px;min-height:20px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Stock Loss Assessment</h1>
    <div class="small">Complete on a phone, then submit to email the report for review.</div>
    <div class="progress">Answered: <span id="answered">0</span> / <span id="total">0</span></div>
    <form id="form" name="stock-loss-assessment" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="stock-loss-assessment" />
      <p style="display:none;"><label>Don’t fill this out: <input name="bot-field" /></label></p>
      <div class="meta">
        <div><label>Name</label><input type="text" name="name" required></div>
        <div><label>TM Number</label><input type="text" name="tmNumber" required></div>
      </div>
      <div id="questions"></div>
      <h2>Final Details</h2>
      <label>Notes</label><textarea name="notes"></textarea>
      <label>Who we coached</label><input type="text" name="coached">
      <button class="submit" type="submit">Submit report</button>
      <div class="status small" id="status"></div>
    </form>
  </div>
<script>
const sections={
"Front End":["Is the people greeter in position, conducting receipt and bag checks?","Are all closed registers secured with yellow chain?","Is the BSCO Register Operator in position, engaging customers and conducting BOBLISACURT?","Are all front end Register Operator conducting BOBLISACURT?"],
"Tool Shop":["Is the Toolshop Register Operator in position, engaging customers and conducting BOBLISACURT?","Are all perspex displays in the tool shop locked?","Are the relevant hammer brackets in place and locked?","Is there at least one team member on the shopfloor within the tool shop?","Is all protected stock bound for the Tool Shop found inside the Tool Shop including bulk pallets?"],
"Gate Keeper":["Is the Gate Keeper in position, wearing a push-to-talk and with a Zebra in-hand or nearby i.e., within 10 steps?","Is the boom gate only opened for exiting customers and in the down position at all other times?","Are vehicle checks occurring in the timber yard?"],
"Protection":["Is the site clear of high risk outbound deliveries in the timber yard?","Are all gates and doors leading to an external area locked?","Does the store have all pay-before-pick-up product stored behind the service desk or in GI i.e., not live on shelf?"],
"Goods Inwards":["Is the CRC process being followed daily including commentary Specific commentary, CRC return slip affixed, no old draft cartons","Is there claimed stock in Goods Inward older than than 4 weeks?","Does the store have any sellable stock subject to damage or theft Power tools, timber, CRC item etc being left in the lanewayexternal GI overnight where weather or theft could have a financial impact?","Was Goods Inwards cleared the night before No more than 8 pallets or cages not worked?","Are cages set up with no double stacking of mixed products and loaded in a way that allows replenishment moving one way down the aisle?","Have invoices been removed from all pallets excluding deliveries from the last two hours?"],
"Nursery":["Is the Nursery People Greeter in position, wearing a push-to-talk with a Zebra in-hand or nearby i.e., within 10 steps, and conducting bag checks?","Is the Nursery Register Operator conducting BOBLISACURT and bag checks?","Has the store marked down past-best plants with clearance prices?"]
};
const qwrap=document.getElementById('questions'); let total=0;
Object.entries(sections).forEach(([section,qs])=>{const h=document.createElement('h2');h.textContent=section;qwrap.appendChild(h);qs.forEach((q,i)=>{total++;const key=`${section}_${i}`.toLowerCase().replace(/[^a-z0-9]+/g,'_');const d=document.createElement('div');d.className='q';d.innerHTML=`<div class='qtext'>${q}</div><input type='hidden' name='${key}' id='${key}' value=''><div class='yn'><button type='button' data-k='${key}' data-v='Yes'>Yes</button><button type='button' data-k='${key}' data-v='No'>No</button></div>`;qwrap.appendChild(d);});});
document.getElementById('total').textContent=total;
function count(){document.getElementById('answered').textContent=[...document.querySelectorAll('input[type=hidden]')].filter(i=>i.value).length}
document.addEventListener('click',e=>{if(!e.target.matches('.yn button')) return; const k=e.target.dataset.k,v=e.target.dataset.v; document.getElementById(k).value=v; document.querySelectorAll(`button[data-k="${k}"]`).forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); e.target.classList.add(v==='Yes'?'yes':'no'); count();});
const form=document.getElementById('form');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = new FormData(form);
  const body = new URLSearchParams(data).toString();
  const res = await fetch('/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
  document.getElementById('status').textContent = res.ok ? 'Submitted successfully.' : 'Submit failed.';
  if (res.ok) form.reset();
});
</script>
</body>
</html>
